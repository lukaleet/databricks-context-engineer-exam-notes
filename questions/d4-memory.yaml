section: d4
questions:
  - id: d4-01
    objective: Identify the mismatch between the memory type being used and the information need, and select the correct memory strategy
    q: >-
      A travel agent asks every new session which airline loyalty program the user belongs to, although the user answered in every
      previous session. Conversation history is persisted per thread. What is the mismatch, and the fix?
    options:
      - 'Cross-session facts are kept only in session history; write them to a long-term store namespaced by user and recall them at session start'
      - 'The thread_id changes every session; reuse one thread_id per user forever'
      - 'The model''s context window is too small; use a larger model'
      - 'Add the loyalty program question to the system prompt'
    answer: [A]
    explain: >-
      Session memory doesn't carry across sessions by design. Durable preferences belong in long-term memory. Reusing one thread
      forever would make the history grow without limit and mix unrelated conversations.

  - id: d4-02
    objective: Identify the mismatch between the memory type being used and the information need, and select the correct memory strategy
    q: >-
      Mid-conversation, a user says "Book the 9am flight instead, like I just said." The agent searches long-term memory, finds an old
      preference for evening flights, and books 6pm. What is the mismatch?
    options:
      - 'It retrieved from long-term memory when the needed information was in the current session'
      - 'The long-term store has too few memories'
      - 'The checkpointer is missing setup()'
      - 'The embedding model is too small'
    answer: [A]
    explain: >-
      The current session holds the latest, explicit instruction. Long-term memory is for cross-session information and shouldn't
      override what the session already contains.

  - id: d4-03
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      An async LangGraph agent must persist each thread's state in Lakebase. The engineer has an async connection pool to the Lakebase
      instance. Which code is correct?
    options:
      - |-
        ```python
        checkpointer = AsyncPostgresSaver(pool)
        await checkpointer.setup()
        graph = builder.compile(checkpointer=checkpointer)
        ```
      - |-
        ```python
        checkpointer = AsyncPostgresSaver(pool)
        checkpointer.setup()
        graph = builder.compile(checkpointer=checkpointer)
        ```
      - |-
        ```python
        checkpointer = AsyncCheckpointer(pool)
        graph = builder.compile(checkpointer=checkpointer)
        ```
      - |-
        ```python
        checkpointer = AsyncPostgresSaver(pool)
        graph = builder.compile()
        graph.invoke(state, checkpointer=checkpointer)
        ```
    answer: [A]
    explain: >-
      `setup()` on the async saver is a coroutine and must be awaited to create the schema; the checkpointer is passed to
      `compile()`. There is no `AsyncCheckpointer` class in LangGraph, and the checkpointer is not an `invoke()` argument.

  - id: d4-04
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      A LangGraph agent with a Lakebase checkpointer loses the conversation after every request, although the checkpoint tables
      contain data. Each call is `graph.invoke({"messages": [...]})`. What is missing?
    options:
      - 'A config with the conversation''s thread id: `config={"configurable": {"thread_id": ...}}`'
      - 'A larger Lakebase instance'
      - 'An AI Search index over the checkpoints'
      - 'A call to checkpointer.setup() before every request'
    answer: [A]
    explain: >-
      Checkpoints are keyed by thread_id. Without it the graph can't load the previous state for that conversation. setup() runs once,
      not per request.

  - id: d4-05
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      Which `databricks-langchain` class provides LangGraph long-term memory on Lakebase with semantic search over stored items?
    options:
      - '`DatabricksStore` (with `embedding_endpoint` and `embedding_dims`)'
      - '`CheckpointSaver`'
      - '`VectorSearchRetrieverTool`'
      - '`ChatDatabricks`'
    answer: [A]
    explain: >-
      `DatabricksStore` implements the LangGraph store on Lakebase and enables semantic search when given an embedding endpoint and
      dimensions. `CheckpointSaver` is short-term (per-thread) state.

  - id: d4-06
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      Long-term memories are stored with `store.put(("memories", user_id), key, value)`. Where should `user_id` come from?
    options:
      - 'From the authenticated request context in application code'
      - 'From the model, by asking it to extract the user''s name from the conversation'
      - 'From a random UUID generated per session'
      - 'From the thread_id'
    answer: [A]
    explain: >-
      Memory scope must come from trusted context (the verified identity), never from model output, or users could read or write
      each other's memories. A per-session id would also break cross-session recall.

  - id: d4-07
    objective: Identify when a Delta-backed state object is required over an in-context scratchpad for an agent operating on a multi-step task
    q: >-
      An agent validates 12,000 vendor records over several nightly runs and must resume after failures without redoing work. Where
      should progress be tracked?
    options:
      - 'In a Delta-backed state table with one row per record and its status'
      - 'In an in-context scratchpad list'
      - 'In the compaction summary'
      - 'In the system prompt, updated after each run'
    answer: [A]
    explain: >-
      Many items, multiple runs, resumability and exact per-item status all require a durable state object outside the context.

  - id: d4-08
    objective: Identify when a Delta-backed state object is required over an in-context scratchpad for an agent operating on a multi-step task
    q: >-
      In which case is an in-context scratchpad sufficient instead of a durable state object?
    options:
      - 'A single-session task of six reasoning steps whose notes easily fit in the window and aren''t needed afterwards'
      - 'A task shared by three agents updating the same progress'
      - 'A task that must be audited later'
      - 'A task spanning several days and restarts'
    answer: [A]
    explain: >-
      Short, single-session work with small notes doesn't need persistence. Sharing, auditability and multi-run durability call for a
      state table.

  - id: d4-09
    objective: Identify whether Databricks AI Search or structured query retrieval is the appropriate mechanism for a specified query type
    q: >-
      An agent's memories live in Lakebase. Which question should be answered with a structured SQL query rather than semantic search?
    options:
      - '"How many support tickets did this customer open since July 1?"'
      - '"What does this customer usually care about when choosing a plan?"'
      - '"Summarize what we discussed about the migration."'
      - '"Does the user have any preferences about report style?"'
    answer: [A]
    explain: >-
      Counts, dates and exact filters are structured queries. Fuzzy, meaning-based recall suits semantic search.

  - id: d4-10
    objective: Identify whether Databricks AI Search or structured query retrieval is the appropriate mechanism for a specified query type
    q: >-
      Memories are stored as short free-text notes. A user asks "what did I say about dashboards I dislike?" Which retrieval
      mechanism fits?
    options:
      - 'Semantic search (AI Search index or the store''s embedding search) over the notes'
      - 'An exact key lookup on the key "dashboards"'
      - 'A SQL COUNT over the notes table'
      - 'Loading all notes into the context'
    answer: [A]
    explain: >-
      The wording of the question differs from how notes were written, so meaning-based search fits. Loading all notes pollutes the
      context.

  - id: d4-11
    objective: Evaluate the tradeoffs of static retrieval vs dynamic retrieval from Lakebase for a given agent architecture
    q: >-
      An agent loads all 300 stored memories for a user into the system prompt at session start. Which problem is most likely?
    options:
      - 'Context pollution and high cost on every call, with irrelevant or outdated memories influencing answers'
      - 'Memories can''t be found because they''re not in the window'
      - 'The checkpointer can''t store the thread'
      - 'Latency increases because of extra tool calls'
    answer: [A]
    explain: >-
      Static loading of large memory is over-retrieval: tokens on every call and confusion from irrelevant items. Extra tool calls are
      a dynamic-retrieval cost, not a static one.

  - id: d4-12
    objective: Evaluate the tradeoffs of static retrieval vs dynamic retrieval from Lakebase for a given agent architecture
    q: >-
      Which design balances static and dynamic memory retrieval for an assistant with a small stable profile and a large, growing set
      of past-project notes?
    options:
      - 'Load the small profile at session start (static) and give the agent a memory search tool for project notes (dynamic)'
      - 'Load everything at session start'
      - 'Load nothing and ask the user to repeat context'
      - 'Store everything in the system prompt and edit it monthly'
    answer: [A]
    explain: >-
      A small always-relevant core is cheap to load; large, topic-specific memory is retrieved only when needed.

  - id: d4-13
    objective: Evaluate the tradeoffs of static retrieval vs dynamic retrieval from Lakebase for a given agent architecture
    q: >-
      What is a main risk of purely dynamic memory retrieval (the agent decides when to call a memory tool)?
    options:
      - 'The agent may not query memory when it should, missing relevant history (under-retrieval)'
      - 'Every memory is loaded into every prompt'
      - 'Memories can''t be updated'
      - 'It requires a Direct Access index'
    answer: [A]
    explain: >-
      Dynamic retrieval depends on the agent asking at the right time and with a good query. Static loading has the opposite risk.

  - id: d4-14
    objective: Diagnose risks of over-retrieval (context pollution) and under-retrieval (missing relevant history) in a memory system
    q: >-
      A personal assistant retrieves the top 25 memories per turn with no similarity threshold. Answers increasingly mention unrelated
      old preferences and occasionally contradict each other. Which change addresses it most directly?
    options:
      - 'Lower k and add a relevance threshold (optionally weight recency), and consolidate duplicate or outdated memories'
      - 'Raise k to 50 so the right memory is always included'
      - 'Switch to a model with a bigger window'
      - 'Delete the long-term store'
    answer: [A]
    explain: >-
      This is over-retrieval (context pollution). Retrieve fewer, more relevant memories and clean up conflicting ones.

  - id: d4-15
    objective: Diagnose risks of over-retrieval (context pollution) and under-retrieval (missing relevant history) in a memory system
    q: >-
      A project assistant often contradicts decisions the team made in earlier sessions. Traces show the memory search returns nothing
      for most queries. The store contains only greetings and timestamps. What is the problem?
    options:
      - 'Under-retrieval caused by poor memory writing: decisions were never extracted and saved as memories'
      - 'Over-retrieval caused by too high k'
      - 'The reranker is disabled'
      - 'The checkpointer uses the wrong thread_id'
    answer: [A]
    explain: >-
      You can only retrieve what was written. Save salient facts and decisions (or run a memory pipeline that distills them from
      sessions).

  - id: d4-16
    objective: Identify the pipeline stage where user intent should be resolved before context retrieval
    q: >-
      A banking assistant's answers are factually accurate but often answer a different question: asked "what's the fee?" after
      discussing international transfers, it returns the card annual fee. Where should the pipeline change?
    options:
      - 'Add an intent-resolution / query-rewriting stage before retrieval that uses the session to produce a self-contained query'
      - 'Add a reranker after retrieval'
      - 'Increase top-k so both fees are retrieved'
      - 'Fine-tune the LLM on fee questions'
    answer: [A]
    explain: >-
      Retrieval ran on an ambiguous raw message. Resolving intent first (using the session context) retrieves the right fee. Retrieving
      both fees adds noise and leaves the choice to chance.

  - id: d4-17
    objective: Identify the pipeline stage where user intent should be resolved before context retrieval
    q: >-
      Which pipeline order is correct for an agent that retrieves context based on multi-turn conversations?
    options:
      - 'Load session context → resolve intent and entities (rewrite the query) → retrieve → generate'
      - 'Retrieve → resolve intent → generate'
      - 'Generate → retrieve → resolve intent'
      - 'Retrieve → generate → resolve intent'
    answer: [A]
    explain: >-
      Intent must be resolved before retrieval so that the query reflects what the user means in context.

  - id: d4-18
    objective: Identify which context configuration produced the most reliable outcomes from MLflow 3 experiment results
    q: >-
      Four context configurations were evaluated in one MLflow experiment on answer_correctness, context_recall and faithfulness.
      "Reliable" means strong on all three, with none lagging. How should the engineer identify that configuration?
    options:
      - 'Use the parallel coordinates chart to find the run that stays high on every metric axis'
      - 'Pick the highest arithmetic mean of the three metrics'
      - 'Pick the run with the single highest metric value'
      - 'Pick the run with the smallest spread between its metrics'
    answer: [A]
    explain: >-
      A mean can hide one weak metric; the single best value ignores the others; a small spread can be uniformly low. Parallel
      coordinates shows all metrics per run at once.

  - id: d4-19
    objective: Identify which context configuration produced the most reliable outcomes from MLflow 3 experiment results
    q: >-
      Config X scored correctness 0.91 in one run; config Y scored 0.88, 0.89 and 0.88 in three runs. X's two reruns scored 0.74 and
      0.95. Which is more reliable for production, and why?
    options:
      - 'Y, because its results are consistently high across repeated runs while X varies widely'
      - 'X, because it achieved the highest single score'
      - 'X, because its average is higher'
      - 'Neither can be compared across runs'
    answer: [A]
    explain: >-
      Reliability includes stability. X averages ~0.87 with a wide spread; Y is steady at ~0.88. Run each configuration several times
      because LLM outputs are non-deterministic.

  - id: d4-20
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      A deployed agent (Model Serving / Agent Framework) receives requests from a front end. How should the front end tell the agent
      which conversation thread to continue?
    options:
      - 'Pass the thread id in `custom_inputs`, e.g. `extra_body={"custom_inputs": {"thread_id": tid}}`'
      - 'Put the thread id in the system prompt'
      - 'Encode it in the endpoint name'
      - 'The agent infers it from the message text'
    answer: [A]
    explain: >-
      Databricks agents receive conversation identifiers via custom inputs (the Playground and Review App send them automatically).

  - id: d4-21
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      When logging an agent that uses a Lakebase database for memory, how should the dependency be declared so the deployed endpoint
      can authenticate to it?
    options:
      - 'Declare a `DatabricksLakebase(database_instance_name=...)` resource when logging the model'
      - 'Hard-code a personal access token in the agent code'
      - 'Grant the endpoint workspace admin'
      - 'No declaration is needed for Lakebase'
    answer: [A]
    explain: >-
      Declaring resources lets Databricks provision credentials for the deployed agent (automatic auth passthrough) instead of
      embedding secrets.

  - id: d4-22
    objective: Identify the mismatch between the memory type being used and the information need, and select the correct memory strategy
    q: >-
      After a server restart, users of a chat agent find their ongoing conversations reset, although long-term preferences are intact.
      What should be added?
    options:
      - 'A durable checkpointer (e.g. on Lakebase) for session state, keyed by thread id'
      - 'More long-term memories'
      - 'A larger embedding model'
      - 'A sliding window'
    answer: [A]
    explain: >-
      Long-term memory works; session state was only in process memory. A durable checkpointer persists threads across restarts.

  - id: d4-23
    objective: Identify whether Databricks AI Search or structured query retrieval is the appropriate mechanism for a specified query type
    q: >-
      Which TWO queries over an agent's memory and interaction history in Lakebase are best served by structured SQL?
    options:
      - '"The last five orders this user discussed, newest first"'
      - '"All memories created between Oct 1 and Oct 15"'
      - '"Things the user finds frustrating"'
      - '"Topics similar to data quality"'
      - '"What kind of tone does the user like?"'
    answer: [A, B]
    explain: >-
      Ordering, limits and date ranges are exact, structured operations. The others are meaning-based and suit semantic search.

  - id: d4-24
    objective: Diagnose risks of over-retrieval (context pollution) and under-retrieval (missing relevant history) in a memory system
    q: >-
      A memory system stores every message of every session as a separate long-term memory. Retrieval returns many near-duplicate,
      partly outdated entries. Which improvement targets the cause?
    options:
      - 'Write distilled facts instead of raw messages and consolidate/deduplicate memories (e.g. a memory pipeline), updating outdated ones'
      - 'Raise k so the newest duplicate is included'
      - 'Store the memories in the system prompt instead'
      - 'Turn off the embedding index'
    answer: [A]
    explain: >-
      Memory quality starts at write time. Distilled, consolidated memories reduce pollution and contradictions.

  - id: d4-25
    objective: Identify when a Delta-backed state object is required over an in-context scratchpad for an agent operating on a multi-step task
    q: >-
      Three sub-agents process parts of the same migration checklist and need to see which items the others have completed. Where
      should progress live?
    options:
      - 'In a shared durable state table (Delta or Lakebase) that all agents read and update'
      - 'In each sub-agent''s own scratchpad'
      - 'In the orchestrator''s compaction summary only'
      - 'In each sub-agent''s system prompt'
    answer: [A]
    explain: >-
      Shared, concurrently updated progress needs a durable store outside any single context window.

  - id: d4-26
    objective: Configure persistent agent memory across sessions using Lakebase-backed durable store
    q: >-
      Why is Lakebase rather than a Delta table used to back an agent's per-turn conversation checkpoints?
    options:
      - 'Lakebase is an OLTP Postgres database with low-latency single-row reads and writes, which every turn needs'
      - 'Delta tables can''t store JSON'
      - 'Lakebase is cheaper for petabyte-scale analytics'
      - 'Delta tables aren''t governed by Unity Catalog'
    answer: [A]
    explain: >-
      Checkpointing is many small transactional reads and writes. Delta is optimized for analytical and batch workloads.

  - id: d4-27
    objective: Identify the mismatch between the memory type being used and the information need, and select the correct memory strategy
    q: >-
      A user asks "What's the company's travel policy hotel cap?" and the agent answers from a long-term memory note in which the user
      once mentioned "my team usually spends about 150". The official policy says 180. What is wrong?
    options:
      - 'Organizational knowledge was taken from personal memory instead of the authoritative knowledge source (retrieval over the policy corpus)'
      - 'The memory store needs more entries'
      - 'The session checkpointer is missing'
      - 'The answer is correct because memory is more personal'
    answer: [A]
    explain: >-
      Memory holds user-specific facts and preferences; policies are knowledge and must come from the governed corpus.

  - id: d4-28
    objective: Identify which context configuration produced the most reliable outcomes from MLflow 3 experiment results
    q: >-
      To compare memory strategies fairly in MLflow, what must be held constant across runs?
    options:
      - 'The evaluation dataset and the scorers (metrics), so only the context configuration differs'
      - 'The run names'
      - 'The time of day the runs execute'
      - 'The number of tokens in each answer'
    answer: [A]
    explain: >-
      Same data, same scorers, one variable changed: otherwise differences can't be attributed to the configuration.
