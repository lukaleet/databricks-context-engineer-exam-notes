section: d7
questions:
  - id: d7-01
    objective: Diagnose root cause when sub-agents receive individual task messages rather than full agent traces, and resolve it without expanding sub-agent context windows
    q: >-
      A coordinator spends 25 turns agreeing with a user on a report's definitions, then dispatches three sub-agents with one-line task
      messages. Their outputs use different definitions and formats. Which configuration fixes this without expanding each
      sub-agent's context window?
    options:
      - 'Attach the coordinator''s full 25-turn transcript to each dispatch message so that nothing agreed with the user is missing'
      - 'Let each sub-agent ask the user for the definitions again before it starts, and record the answers'
      - 'Run each sub-agent on a larger model so it can infer the definitions from its one-line task message'
      - 'Attach a compressed summary of the coordinator''s trace (decisions, definitions, constraints) to each dispatch'
    answer: [D]
    explain: >-
      Sub-agents lacked the coordinator's decisions. A compressed trace summary shares them in a few hundred tokens; the full
      transcript would blow up every sub-agent's window.

  - id: d7-02
    objective: Diagnose root cause when sub-agents receive individual task messages rather than full agent traces, and resolve it without expanding sub-agent context windows
    q: >-
      Five forecasting sub-agents produce outputs that are consistent with each other but all use pre-update inventory figures. The
      coordinator's log shows it has the updated figures. Each sub-agent's retrieved context cites the old figures from an AI Search
      index; the source Delta table was updated an hour ago. What is the root cause?
    options:
      - 'The embedding model can''t represent numeric changes, so updated rows still match the old embeddings'
      - 'The sub-agents received task messages without the coordinator''s trace, so they lack the new figures'
      - 'The index wasn''t synced after the update, so every sub-agent retrieves the same stale data'
      - 'The sub-agents'' context windows are too small to hold the updated inventory figures'
    answer: [C]
    explain: >-
      Mutually consistent but stale outputs point to a shared stale source. The evidence (retrieved context cites old values; table is
      current) identifies the unsynced index.

  - id: d7-03
    objective: Diagnose multi-agent failure modes caused by insufficient shared context
    q: >-
      Two sub-agents build parts of a UI: one chooses a dark theme with rounded buttons, the other a light theme with square buttons.
      Neither was told about the other's choices. What principle was violated?
    options:
      - 'Sub-agents must never run in parallel, even on parts of a task that are fully independent'
      - 'Sub-agents must all run on the same model, or their default styles differ for the same task'
      - 'Each sub-agent must have its own tool set, or they interfere with each other''s design choices'
      - 'Actions carry implicit decisions, so sub-agents must share them or their decisions conflict'
    answer: [D]
    explain: >-
      Each sub-agent made implicit design decisions in isolation. Sharing context (or making dependent work sequential) prevents the
      conflict.

  - id: d7-04
    objective: Given a multi-agent system producing conflicting outputs, identify the context propagation change most likely to prevent the conflict
    q: >-
      A planning sub-agent and a budgeting sub-agent run in parallel; the plan assumes a vendor the budget agent already rejected.
      Which change most likely prevents this?
    options:
      - 'Give both agents access to the same vendor tools so they see the same vendor data while working'
      - 'Run the dependent steps in sequence, passing the budget agent''s decisions to the planner'
      - 'Add a third agent that reviews both outputs at the end and merges them into one consistent plan'
      - 'Give both agents the full list of candidate vendors at dispatch so they start from the same options'
    answer: [B]
    explain: >-
      The planner depends on the budget decision, so the steps aren't independent. Run them in sequence (or share decisions through a
      common state store) so the decision is propagated before planning. A final merge only finds the conflict afterwards, and the same
      vendor list or tools don't tell the planner which vendor was rejected.

  - id: d7-05
    objective: Given an orchestrating agent experiencing context saturation, identify the sub-agent output design change that most reduces orchestrator load without compromising coherence
    q: >-
      An orchestrator receives each of six sub-agents' full transcripts (15–30k tokens each) and its quality drops. Which change best
      reduces its context load without losing coherence?
    options:
      - 'Truncate each sub-agent''s transcript to its first 2,000 characters before passing it to the orchestrator'
      - 'Have the orchestrator summarize each transcript as it arrives, keeping the summaries and discarding the rest'
      - 'Have sub-agents return condensed, structured results with references to their full outputs'
      - 'Give the orchestrator a model with a larger context window so all six transcripts fit with room to spare'
    answer: [C]
    explain: >-
      Condensed structured returns give the orchestrator what it needs to integrate results, and references keep the full data
      available. Having the orchestrator summarize transcripts as they arrive still pulls every full transcript into its context first.
      Truncation loses information arbitrarily, and a bigger window doesn't fix the dilution.

  - id: d7-06
    objective: Given an orchestrating agent experiencing context saturation, identify the sub-agent output design change that most reduces orchestrator load without compromising coherence
    q: >-
      Why do sub-agents that write large results to a Delta table and return a table name plus a summary help the orchestrator?
    options:
      - 'Writing to Delta lets the sub-agents run in parallel, which shortens the orchestrator''s session'
      - 'The orchestrator can''t see the results, so it can''t be influenced by sub-agent errors'
      - 'The orchestrator holds only a summary and a handle; the full data stays accessible'
      - 'Delta tables are loaded into the orchestrator''s context automatically, in a compressed format'
    answer: [C]
    explain: >-
      References instead of payloads keep the orchestrator's window small without losing data.

  - id: d7-07
    objective: Diagnose which boundary placement failure is occurring
    q: >-
      A workflow uses 14 agents, each handling one small step of a tightly coupled data-modeling task. Each handoff summarizes the
      previous agent's work, and details are frequently lost. Which boundary failure is this?
    options:
      - 'Boundaries too fine: excessive handoff compression overhead across tightly coupled steps'
      - 'Boundaries are correct; the agents need a shared long-term memory store to keep details'
      - 'Boundaries too coarse: one agent''s context grows without control across loosely related steps'
      - 'Boundaries are correct; details are lost because the handoff summaries use a small model'
    answer: [A]
    explain: >-
      Tightly coupled work split into many agents forces lossy summaries at every hop. Merge coupled steps.

  - id: d7-08
    objective: Diagnose which boundary placement failure is occurring
    q: >-
      One agent handles intake, research across 20 sources, financial modeling and report writing. Its context repeatedly saturates and
      it compacts every few steps. Which boundary failure is this and what's the fix?
    options:
      - 'No boundary failure; compact more often so that the single agent''s context stays under control'
      - 'Too coarse; split along loosely coupled parts, such as per-source research in separate sub-agents'
      - 'Too fine; merge intake and report writing into the research step so fewer handoffs are needed'
      - 'Too fine; add more handoffs between the existing steps so that each one gets a fresh context'
    answer: [B]
    explain: >-
      Unmanageable context growth inside one agent signals boundaries that are too coarse. Split where the interface is narrow.

  - id: d7-09
    objective: Identify which long-horizon strategy mismatch is causing a failure, select the replacement strategy, and justify it
    q: >-
      A team runs parallel sub-agents on a refactoring task where each step changes code that the next step builds on. Outputs
      conflict and the build breaks. Which replacement strategy fits, and why?
    options:
      - 'More, smaller sub-agents in parallel, because smaller steps conflict less when they are merged at the end'
      - 'The same sub-agents with larger context windows, because they need room to read the whole codebase'
      - 'The same design plus a final merge agent, because conflicts can be resolved once all steps are done'
      - 'A single sequential agent with compaction or notes, because each step depends on the last'
    answer: [D]
    explain: >-
      The dependency structure is sequential. Parallelism is the wrong fit; one thread of decisions avoids conflicts.

  - id: d7-10
    objective: Identify which long-horizon strategy mismatch is causing a failure, select the replacement strategy, and justify it
    q: >-
      An agent reconciles 3,000 payments over several runs using repeated compaction. After a few compactions it re-processes some
      payments and skips others. Which replacement strategy fits, and what makes compaction insufficient?
    options:
      - 'A model with a larger context window, because then the full payment list fits without any compaction'
      - 'A durable state table (note-taking), because exact per-item status can''t survive repeated summarization'
      - 'Parallel sub-agents without shared state, because each can process its own share of payments independently'
      - 'More aggressive compaction, because shorter summaries leave more room for the list of processed payments'
    answer: [B]
    explain: >-
      Summaries are lossy; exact progress over thousands of items needs an external state object.

  - id: d7-11
    objective: Identify which long-horizon strategy mismatch is causing a failure, select the replacement strategy, and justify it
    q: >-
      A single agent researches 40 independent companies one after another; its window saturates halfway and quality drops for the
      later companies. Which strategy fits better?
    options:
      - 'A single agent that compacts after each company, because compaction keeps the full findings'
      - 'A single agent with a sliding window, because each company''s research is finished before the next'
      - 'A single agent with extended thinking, because deeper reasoning keeps quality up later in the run'
      - 'Sub-agents per company (or batch) with condensed returns, because the subtasks are independent'
    answer: [D]
    explain: >-
      Independent breadth-first work is where sub-agent isolation helps most.

  - id: d7-12
    objective: Diagnose multi-agent failure modes caused by insufficient shared context
    q: >-
      Which symptom most directly indicates insufficient shared context between sub-agents (as opposed to a shared stale data source)?
    options:
      - 'All sub-agents time out after the orchestrator dispatches more than a handful of them at once'
      - 'Sub-agents'' outputs disagree with each other (different assumptions, definitions or formats)'
      - 'The orchestrator responds slowly because it waits for the slowest sub-agent before merging'
      - 'All sub-agents agree with each other, but every one of them reports the same outdated numbers'
    answer: [B]
    explain: >-
      Disagreement between sub-agents signals missing shared context. Consistent-but-wrong signals a common stale input.

  - id: d7-13
    objective: Diagnose root cause when sub-agents receive individual task messages rather than full agent traces, and resolve it without expanding sub-agent context windows
    q: >-
      Which TWO pieces of information should a compressed trace summary at dispatch include?
    options:
      - 'The coordinator''s full raw tool outputs'
      - 'Constraints and conventions all sub-agents must follow (currency, format, exclusions)'
      - 'Greetings exchanged with the user'
      - 'Decisions already made and their reasons (e.g. "active customer = order in last 90 days")'
      - 'Every intermediate draft the coordinator rejected'
    answer: [B, D]
    explain: >-
      Shared decisions and constraints prevent conflicts. Raw outputs, chatter and drafts would expand the sub-agents' windows.

  - id: d7-14
    objective: Diagnose multi-agent failure modes caused by insufficient shared context
    q: >-
      A multi-agent system works on simple requests but fails unpredictably on complex ones, each handoff dropping some detail. Which
      failure mode is this?
    options:
      - 'Over-retrieval from the agents'' long-term memory'
      - 'Degraded reliability from context lost at handoffs'
      - 'Context poisoning that spreads from the orchestrator'
      - 'A stale AI Search index shared by the sub-agents'
    answer: [B]
    explain: >-
      Complex tasks need more shared context; each lossy handoff compounds. Fewer handoffs and richer handoff summaries help.

  - id: d7-15
    objective: Identify which long-horizon strategy mismatch is causing a failure, select the replacement strategy, and justify it
    q: >-
      A human-in-the-loop approval workflow pauses for hours or days waiting for managers. After a redeploy, paused tasks are lost.
      What should be added?
    options:
      - 'Checkpoint and resume with a durable checkpointer (e.g. LangGraph on Lakebase)'
      - 'A sub-agent per manager that keeps its own copy of the paused task''s state while it waits'
      - 'A long-term memory store that records each manager''s approval decisions for future requests'
      - 'Compaction of each paused task''s history, so it is small enough to keep in process memory'
    answer: [A]
    explain: >-
      Long pauses and redeploys require persisted state that can be resumed: a durable checkpointer keyed by thread. Long-term memory
      stores facts across sessions, not the task's execution state, and compaction or sub-agents still keep the state in process memory.

  - id: d7-16
    objective: Given an orchestrating agent experiencing context saturation, identify the sub-agent output design change that most reduces orchestrator load without compromising coherence
    q: >-
      What return format should a research sub-agent use to keep the lead agent coherent and its context small?
    options:
      - 'A fixed schema of findings with sources, decisions, confidence and open questions (~1–2k tokens)'
      - 'A one-line status ("done" or "failed"), with the details kept in the sub-agent''s own context'
      - 'All raw web pages it read, so the lead agent can re-check the sources against the findings'
      - 'Its full message history, so the lead agent can check every step of the sub-agent''s reasoning'
    answer: [A]
    explain: >-
      A condensed, structured summary carries what the lead needs to integrate results; "done" loses information and raw pages flood
      the context.

  - id: d7-17
    objective: Diagnose which boundary placement failure is occurring
    q: >-
      What principle should guide where to draw agent boundaries?
    options:
      - 'One agent per data source, so that each agent only needs permissions on a single source'
      - 'One agent per tool, so that each agent''s tool set and context stay as small as possible'
      - 'Split where coupling is low and interfaces are narrow; keep tightly coupled steps in one agent'
      - 'As many agents as possible, to maximize parallelism and keep every context window short'
    answer: [C]
    explain: >-
      Boundaries along coupling minimize both handoff loss and per-agent context growth.

  - id: d7-18
    objective: Given a multi-agent system producing conflicting outputs, identify the context propagation change most likely to prevent the conflict
    q: >-
      Three sub-agents write sections of one document and each invents its own terminology for the same concepts. What propagation
      change most likely prevents this?
    options:
      - 'Add a final agent that rewrites all sections to make the terminology consistent afterwards'
      - 'Increase each sub-agent''s retrieval top-k so they all find the same source documents'
      - 'Give all sub-agents a shared glossary and style brief at dispatch'
      - 'Run all sub-agents at temperature 0 so they choose the same terms for the same concepts'
    answer: [C]
    explain: >-
      Shared conventions at dispatch prevent the divergence instead of repairing it afterwards.

  - id: d7-19
    objective: Identify which long-horizon strategy mismatch is causing a failure, select the replacement strategy, and justify it
    q: >-
      For a long, conversational debugging session with a user (many back-and-forth turns, each building on the last), which
      long-horizon strategy fits best?
    options:
      - 'A sliding window of the last 5 turns, because each turn mostly builds on the one just before it'
      - 'A new session every 10 turns, with the user re-stating the problem, to keep the context short'
      - 'A single agent with compaction, because continuity of one conversational thread matters most here'
      - 'Parallel sub-agents, one per hypothesis, because debugging hypotheses can be tested independently'
    answer: [C]
    explain: >-
      Compaction suits extensive back-and-forth where the thread of conversation must be kept.

  - id: d7-20
    objective: Diagnose root cause when sub-agents receive individual task messages rather than full agent traces, and resolve it without expanding sub-agent context windows
    q: >-
      Why is passing the coordinator's full raw trace to each sub-agent usually the wrong fix for missing shared context?
    options:
      - 'Sub-agents can only receive a single task message, so a trace can''t be attached at dispatch'
      - 'It fills every sub-agent''s context with mostly irrelevant tokens, adding cost and distraction'
      - 'It shares the decisions but not the constraints, so the sub-agents'' outputs still conflict'
      - 'Full traces can only be read from MLflow, so the sub-agents can''t access them at dispatch'
    answer: [B]
    explain: >-
      The goal is shared decisions, not the whole history. The full trace fills each sub-agent's window with mostly irrelevant tokens
      (cost and distraction); a compressed summary of decisions and constraints gives the benefit without the cost. Attaching it at
      dispatch is technically fine.

  - id: d7-21
    objective: Diagnose multi-agent failure modes caused by insufficient shared context
    q: >-
      In a Databricks multi-agent system, how can an engineer verify what context each sub-agent actually received at dispatch?
    options:
      - 'Check the Unity Catalog lineage graph for the tables each sub-agent read during the run'
      - 'Read the orchestrator''s system prompt, which defines what each dispatch message contains'
      - 'Ask the orchestrator, at the end of the run, to list what it sent to each sub-agent'
      - 'Inspect the MLflow trace, where each sub-agent''s span shows its actual inputs and outputs'
    answer: [D]
    explain: >-
      Tracing records the actual inputs and outputs of every span, including sub-agent calls.

  - id: d7-22
    objective: Given an orchestrating agent experiencing context saturation, identify the sub-agent output design change that most reduces orchestrator load without compromising coherence
    q: >-
      An orchestrator saturates because sub-agents return verbose prose of varying structure, and it must re-read everything to merge
      results. Which TWO changes help most?
    options:
      - 'Store full results externally and return references'
      - 'Ask sub-agents to include all intermediate reasoning'
      - 'Increase the number of sub-agents'
      - 'Define a compact output schema every sub-agent must follow'
      - 'Remove the orchestrator''s system prompt'
    answer: [A, D]
    explain: >-
      A fixed compact schema and references instead of payloads cut orchestrator load while keeping what it needs.
